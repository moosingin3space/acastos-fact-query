name: Fuzz

# Manually triggered differential fuzzing of the ascent-jit engine. Runs the
# in-tree arbtest suite (stable toolchain) at a configurable budget via the
# Justfile's `fuzz-quick` recipe.
on:
  workflow_dispatch:
    inputs:
      budget_ms:
        description: "Per-property fuzz budget in milliseconds"
        required: false
        default: "30000"

jobs:
  fuzz:
    name: differential fuzz (arbtest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # The Justfile is the source of truth for how fuzzing runs.
      - name: Run differential fuzzing
        run: just fuzz-quick ${{ inputs.budget_ms }}
