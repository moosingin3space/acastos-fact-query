[package]
name = "ascent-jit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A runtime interpreter for Ascent Datalog programs supplied as data, with semi-naive indexed evaluation, provenance, and speculative evaluation."
keywords = ["datalog", "ascent", "interpreter", "logic"]
categories = ["compilers", "data-structures"]
readme = "../README.md"

[dependencies]
arbitrary = { version = "1.4", optional = true }

# Grows the stack on demand in the engine's recursive walks (see `stack.rs`).
# Native-only: on `wasm32` stacker cannot find the stack limit and would
# allocate a fresh stack on every guarded call, so there the expression depth
# limit is the only defence (and a wasm stack overflow is a trap, not UB).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
stacker = "0.1.25"

[features]
# Enables the `fuzz` module: `arbitrary`-based generators and differential
# checkers shared by the in-tree `arbtest` tests and the `cargo-fuzz` targets.
arbitrary = ["dep:arbitrary"]

[dev-dependencies]
ascent = "0.8"
arbtest = "0.3"
criterion = "0.8"

[[bench]]
name = "joins"
harness = false

[[bench]]
name = "expr"
harness = false

[[bench]]
name = "queries"
harness = false

[lints]
workspace = true
